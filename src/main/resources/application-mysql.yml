# MySQL 配置:以 --spring.profiles.active=mysql 启动时生效
# 需要先执行: CREATE DATABASE etf_momentum DEFAULT CHARACTER SET utf8mb4;
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/etf_momentum?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "改成你的密码"
  sql:
    init:
      mode: always
      platform: mysql
